# Workflow ÚNICO do pipeline (enunciado, seção 2 e Etapa 7).
#
# STATUS: esqueleto mínimo. Roda testes e o notebook 01. Ainda NÃO foi executado no GitHub Actions.
# Responsável pelo critério 7: completar (ver docs/divisao_de_tarefas.md).
#
# Pendências do critério 7:
#   1. Ativar `schedule` (o enunciado exige evidência de execução pelo gatilho agendado;
#      workflow_dispatch serve só para depuração).
#   2. Encadear os notebooks 02 -> 03 -> 04 (-> 05) quando estiverem prontos. Falha em qualquer um
#      deve interromper o fluxo (comportamento padrão dos steps).
#   3. Persistir o estado entre execuções (o runner é efêmero): manifesto dos lotes, histórico do MLflow
#      e models/modelo_vigente.json. Sem isso, todo ciclo recomeça do zero.
#   4. Simular a chegada de dados: `python -m src.ingestao --liberar 1` antes do notebook 01,
#      persistindo o manifesto atualizado (item 3).

name: pipeline-mlops

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 9 * * 1"   # exemplo: segundas às 09:00 UTC; conferir permissões e atrasos do Actions

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: 01 - ETL
        run: >
          jupyter nbconvert --to notebook --execute notebooks/01_etl.ipynb
          --output 01_executado.ipynb --output-dir evidencias/execucao

      # TODO(critério 7): 02_votacao_features -> 03_treino_competicao -> 04_selecao_promocao -> 05_previsoes

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.run_id }}
          path: |
            evidencias/
            data/processed/ciclo_atual.json
          if-no-files-found: warn
